name: kor-lilith-engine-stack
description: Complete pinned KOR stack for Hermes Agent — KIE, Evidence, and the three supporting engines
author: oORaxaOo
version: 0.3.0
plugins:
  - repo: oORaxaOo/Evidence-Engine
    ref: 3f75173236b602131e332f61a7162bda720a370a
  - repo: oORaxaOo/Critical-Thinking-Engine
    ref: b1d1c4b2085c14dd34708c9687c68e4f80e428da
  - repo: oORaxaOo/Reliability-Engine
    ref: db9fde87698f0fee245c1f261529014040fe3d7c
  - repo: oORaxaOo/Emotion-Engine
    ref: 38783a43bde84cf1aa85f2aa73b722db0d827a5a
  - repo: oORaxaOo/KOR-Integration-Engine-
    subdir: plugins/hermes-kie-evidence
    ref: 681f60b53cd5b8e630fcae65a0b3d9f267ead477
config:
  kor-kie-evidence:
    engine_event_socket: ~/.hermes/run/kie-engine-events.sock
    kie_database: ~/.hermes/kie/kie.sqlite3
    evidence_source_root: ~/.hermes/plugins/evidence-engine
    evidence_database: ~/.hermes/evidence-engine/evidence.sqlite3
  evidence-engine:
    kie_event_socket: ~/.hermes/run/kie-engine-events.sock
  critical-thinking-engine:
    kie_event_socket: ~/.hermes/run/kie-engine-events.sock
  reliability-engine:
    kie_event_socket: ~/.hermes/run/kie-engine-events.sock
  emotion-engine:
    kie_event_socket: ~/.hermes/run/kie-engine-events.sock
