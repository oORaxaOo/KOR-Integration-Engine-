plugins:
  entries:
    kor-kie-evidence:
      settings:
        evidence_python: /absolute/path/to/hermes/python
        evidence_source_root: /absolute/path/to/Evidence-Engine
        evidence_database: /absolute/path/to/evidence.sqlite3
        kie_database: /absolute/path/to/kie-integration.sqlite3
        timeout_seconds: 10
        engine_event_socket: /home/USER/.hermes/run/kie-engine-events.sock

    critical-thinking-engine:
      settings:
        kie_event_socket: /home/USER/.hermes/run/kie-engine-events.sock
    reliability-engine:
      settings:
        kie_event_socket: /home/USER/.hermes/run/kie-engine-events.sock
    emotion-engine:
      settings:
        kie_event_socket: /home/USER/.hermes/run/kie-engine-events.sock
